name: .NET 10 build & test

on:
  push:
    branches: [ dotnet10 ]
  pull_request:
    branches: [ dotnet10 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore OodInterview.slnx
      - name: Build
        run: dotnet build OodInterview.slnx --no-restore -c Release
      - name: Test
        run: dotnet test OodInterview.slnx --no-build -c Release --logger "trx" --results-directory TestResults
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re
          total = passed = failed = 0
          for f in glob.glob('TestResults/*.trx'):
              s = open(f, encoding='utf-8').read()
              m = re.search(r'<Counters total="(\d+)"[^>]*passed="(\d+)" failed="(\d+)"', s)
              if m:
                  total += int(m.group(1)); passed += int(m.group(2)); failed += int(m.group(3))
          print(f"::notice title=Tests::{passed}/{total} passed, {failed} failed")
          PY
